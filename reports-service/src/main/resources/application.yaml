spring:
  application:
    name: reports-service
  cloud:
    config:
      uri: http://localhost:8888
    discovery:
      client:
        serviceUrl:
          defaultZone: http://localhost:8761/eureka/

server:
  port: 8087

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 20
