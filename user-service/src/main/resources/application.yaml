spring:
  application:
    name: user-service
  cloud:
    config:
      uri: http://localhost:8888
    discovery:
      client:
        serviceUrl:
          defaultZone: http://localhost:8761/eureka/
  datasource:
    url: jdbc:postgresql://localhost:5432/toolrent_userdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8088

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 20
